name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Logic tests
        run: dotnet run --project tests/GolfJoyBridge.Tests/GolfJoyBridge.Tests.csproj
      - name: Publish
        run: dotnet publish src/GolfJoyBridge.App/GolfJoyBridge.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GolfJoyBridge-win-x64
          path: publish/GolfJoyBridge.exe
